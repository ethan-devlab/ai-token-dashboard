<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Local Codex Token Dashboard configuration" />
    <title>Codex Token Dashboard settings</title>
    <link rel="stylesheet" href="/styles/tokens.css" />
    <link rel="stylesheet" href="/styles/base.css" />
    <link rel="stylesheet" href="/styles/components.css" />
    <link rel="stylesheet" href="/styles/settings.css" />
    <script type="module" src="/scripts/settings.mjs"></script>
  </head>
  <body>
    <main class="app-shell settings-shell">
      <header class="app-header">
        <div><p class="eyebrow" data-i18n="settings.eyebrow">本機設定</p><h1 data-i18n="settings.title">儀表板設定</h1><p class="subtitle" data-i18n="settings.subtitle">編輯本機 .env 設定。變更會在重新啟動後套用。</p></div>
        <div class="header-actions"><a class="button button--secondary" href="/" data-i18n="settings.back">返回儀表板</a></div>
      </header>

      <p id="settingsNotice" class="notice" role="status" aria-live="polite" data-i18n="settings.loading">正在讀取本機設定…</p>
      <section id="settingsUnavailable" class="surface settings-unavailable" role="status" hidden><h2 data-i18n="settings.unavailableTitle">設定僅限本機</h2><p data-i18n="settings.unavailable">此伺服器目前使用遠端繫結，因此無法安全地從瀏覽器編輯其 .env。請在主機上修改設定，重新啟動後再返回儀表板。</p></section>
      <form id="settingsForm" class="settings-form">
        <fieldset class="surface settings-group">
          <legend data-i18n="settings.source">SESSION 來源</legend>
          <div class="settings-grid">
            <label class="control settings-control"><span data-i18n="settings.codexDirectory">Codex sessions 目錄</span><input name="CODEX_SESSIONS_DIR" type="text" autocomplete="off" required aria-describedby="directoryHint" /></label>
            <label class="control settings-control"><span data-i18n="settings.claudeDirectory">Claude sessions 目錄</span><input name="CLAUDE_SESSIONS_DIR" type="text" autocomplete="off" required aria-describedby="directoryHint" /></label>
            <label class="control settings-control"><span data-i18n="settings.maxFiles">最大檔案數</span><input name="MAX_FILES" type="number" min="1" max="100000" required /></label>
            <label class="control settings-control"><span data-i18n="settings.parseConcurrency">解析並行數</span><input name="PARSE_CONCURRENCY" type="number" min="1" max="16" required /></label>
          </div>
          <p id="directoryHint" class="muted settings-hint" data-i18n="settings.pathHint">此本機路徑不會傳送至外部服務。</p>
        </fieldset>

        <fieldset class="surface settings-group">
          <legend data-i18n="settings.network">網路與隱私</legend>
          <div class="settings-grid">
            <label class="control settings-control"><span data-i18n="settings.host">主機</span><input name="HOST" type="text" autocomplete="off" required /></label>
            <label class="control settings-control"><span data-i18n="settings.port">連接埠</span><input name="PORT" type="number" min="1" max="65535" required /></label>
          </div>
          <div class="settings-checks">
            <label class="control"><input name="ALLOW_REMOTE" type="checkbox" /> <span data-i18n="settings.allowRemote">允許遠端繫結</span></label>
            <label class="control"><input name="EXPOSE_FULL_PATHS" type="checkbox" /> <span data-i18n="settings.exposeFullPaths">顯示完整路徑</span></label>
          </div>
          <p id="remoteWarning" class="settings-warning" hidden data-i18n="settings.remoteWarning">遠端存取可能暴露本機使用量中繼資料。除非理解網路邊界，否則請保持關閉。</p>
        </fieldset>

        <fieldset class="surface settings-group">
          <legend data-i18n="settings.performance">效能</legend>
          <div class="settings-grid">
            <label class="control settings-control"><span data-i18n="settings.autoRefreshDebounce">監看延遲（ms）</span><input name="AUTO_REFRESH_DEBOUNCE_MS" type="number" min="100" max="60000" required /></label>
          </div>
          <div class="settings-checks"><label class="control"><input name="AUTO_REFRESH" type="checkbox" /> <span data-i18n="settings.autoRefresh">自動監看 JSONL 變更</span></label></div>
        </fieldset>

        <fieldset class="surface settings-group">
          <legend data-i18n="settings.updates">更新</legend>
          <div class="settings-grid"><label class="control settings-control"><span data-i18n="settings.updateRepository">GitHub 更新儲存庫</span><input name="UPDATE_REPOSITORY" type="text" autocomplete="off" pattern="[A-Za-z0-9][A-Za-z0-9_.-]*/[A-Za-z0-9][A-Za-z0-9_.-]*" /></label></div>
        </fieldset>

        <div class="settings-actions"><p class="muted" data-i18n="settings.restart">這些值僅儲存於本機，必須在重新啟動儀表板後才會套用。</p><button class="button--primary" id="settingsSave" type="submit" data-i18n="settings.save">儲存至 .env</button></div>
      </form>
    </main>
  </body>
</html>
