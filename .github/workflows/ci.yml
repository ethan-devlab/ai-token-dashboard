name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22.15.0'
          - os: windows-latest
            node: '24'
          - os: macos-latest
            node: '24'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Check syntax
        run: npm run check
      - name: Test server
        run: npm run test:server
      - name: Test client
        run: npm run test:client
      - name: Test HTTP contracts
        run: npm run test:contract
      - name: Test accounting and detail limits
        run: node --test tests/phase1-accounting.test.mjs tests/detail-completeness.test.mjs
      - name: Test configured detail response over HTTP
        run: node tests/detail-completeness-http.mjs --configured-limit
