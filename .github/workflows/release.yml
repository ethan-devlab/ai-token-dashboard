name: Release source archive

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.1
      - name: Verify tag and package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          test "${TAG#v}" = "$(node -p "require('./package.json').version")"
      - name: Validate source
        run: |
          npm run check
          npm run test:server
          npm run test:client
          npm run test:contract
          node --test tests/pricing-archive.test.mjs tests/phase1-accounting.test.mjs tests/latest-model-pricing.test.mjs
      - name: Create source archive and digest
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p release
          git archive --format=zip --prefix="ai-token-dashboard-${TAG}/" --output="release/ai-token-dashboard-${TAG}.zip" "$GITHUB_SHA"
          sha256sum "release/ai-token-dashboard-${TAG}.zip" > release/SHA256SUMS
          cp docs/migration-v3.md "release/MIGRATION-${TAG}.md"
          if test -f "docs/releases/${TAG}.md"; then
            cat "docs/releases/${TAG}.md" docs/migration-v3.md > release/RELEASE-NOTES.md
          else
            cp docs/migration-v3.md release/RELEASE-NOTES.md
          fi
      - name: Attest source archive
        uses: actions/attest@v4
        with:
          subject-path: release/ai-token-dashboard-${{ github.ref_name }}.zip
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" "release/ai-token-dashboard-${TAG}.zip" release/SHA256SUMS "release/MIGRATION-${TAG}.md" --notes-file release/RELEASE-NOTES.md --generate-notes
